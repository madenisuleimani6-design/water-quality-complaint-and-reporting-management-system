# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy branch: main | Root directory: backend
# SQLite: committed backend/db.sqlite3 — do NOT set DATABASE_URL

services:
  - type: web
    name: dawasa-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: daphne config.asgi:application -b 0.0.0.0 -p $PORT
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: USE_MYSQL
        value: "false"
      - key: SQLITE_DB_NAME
        value: db.sqlite3
      - key: OTP_MOCK_MODE
        value: "false"
      - key: MAP_BOX_TOKEN
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
